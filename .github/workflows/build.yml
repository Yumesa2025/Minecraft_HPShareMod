name: Build

on:
  push:
    branches: [main]
    # 사이트와 문서만 바뀐 커밋에서 Gradle 빌드를 통째로 돌릴 이유가 없다.
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: sharedfate-${{ github.sha }}
          path: |
            build/libs/sharedfate-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
